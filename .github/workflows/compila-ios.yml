name: Compila Le Paroline di Bea

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Compilazione per il simulatore iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scarica i quattro versi CC0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Bea/Game/audio
          fetch_sound() {
            local output="Bea/Game/audio/$1.mp3"
            curl --fail --show-error --silent --location --retry 3 --max-time 45 \
              "https://sfxmint.com/dl/$2.mp3" --output "$output"
            afinfo "$output" >/dev/null
          }
          fetch_sound cane animal-dog-bark-25
          fetch_sound gatto animal-cat-meow-34
          fetch_sound mucca cow-moo-02
          fetch_sound papera duck-quack-02
      - name: Compila con Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project Bea.xcodeproj -target Bea \
            -configuration Debug -sdk iphonesimulator \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/bea-build" \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/bea-build/Bea.app" "$RUNNER_TEMP/Bea-simulatore.zip"
      - name: Salva l’app per il simulatore
        uses: actions/upload-artifact@v4
        with:
          name: Bea-simulatore
          path: ${{ runner.temp }}/Bea-simulatore.zip
          if-no-files-found: error
